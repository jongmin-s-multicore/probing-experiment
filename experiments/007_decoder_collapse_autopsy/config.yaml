  action_value: 0.0
criteria:                         # notes/hypotheses.md "007 진단 질문" 의 사전 기록과 같음
  dependence_lost_ratio: 0.01     # 층 출력 입력간 std < 대조 평균 std 의 1/100
  weight_change_ratio: 10.0       # 붕괴 run 의 ||W3-W2||/||W2|| >= 대조 3개 최댓값의 10배
smoke:
  n_frames: 6
