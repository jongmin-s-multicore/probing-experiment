name: "003_train_dist_dependence"
hypothesis: "H"      # notes/hypotheses.md 후보 H (확정 기록 8)
seed: 0              # 전역 시드 (numpy/torch/random). 학습 시드는 train.seeds 가 따로 있다.

# 코드 출처: 001 과 같은 acwm-phys commit (읽기 전용 checkout, setup.sh 가 만든다). 001 config 에서 그대로 옮김.
code:
  repo_url: "https://github.com/jongmin-s-multicore/thread0.git"
  branch: "hanbin5/acwm-phys"
  commit: "5a640bed66002eca7bdb31d10b2bde59ad944551"
  src_env: "ACWM_PHYS_SRC"

# 경로는 환경변수로 받는다 (괄호는 기본값). 체크포인트: $DINO_TRAIN/outputs/<run_name>/
paths:
  work_env: "DINO_WORK"            # (~/dinowm)
  dataset_env: "DATASET_DIR"       # ($DINO_WORK/data)
  train_env: "DINO_TRAIN"          # ($DINO_WORK/train_runs)
  cache_env: "EXP003_CACHE"        # ($DINO_WORK/exp003_cache) 추출 결과 npz (001 보다 훨씬 작다: 면적 스칼라만 저장)

run:
  max_attempts: 3                  # CLAUDE.md: 한 실험의 재시도 최대 3회. 단계별 연속 실패 횟수가 results/attempts.json 에 기록되고 3회면 멈춘다.

data:
  source: "drive"                  # drive (rclone, 001 과 같은 방식) | hf (사용 불가 보고됨, 코드는 유지)
  drive:
    rclone_remote: "gdrive"        # 001 config sync.drive.rclone_remote 와 같은 값 (001 에서 사용자 지정). 이 머신에서 미확인
    root_folder_id: "1z4z6WA2G-7UXjbrJtLSWqm6KBpuHrkiI"     # 001 과 같은 Drive 데이터 폴더
    root_folder_style: "connection_string"
    remote_path: ""
    rclone_bin: "rclone"
  frames_per_episode: 65
  action_dims: [0, 1, 2, 4, 5, 6]
  img_size: 224
  frameskip: 5
  dataset: "cloth_sim"
  datasets:
    cloth_sim:
      kind: "cloth_sim"
      run_name_template: "exp003_{dist}_s{seed}"
      hf_repo: "hanbin5/cloth-sim"
      hf_repo_type: "dataset"
      hf_revision: null
      subdir: "cloth_sim"          # 001 과 같은 폴더를 쓰면 이미 받은 데이터를 재사용한다 (DATASET_DIR 이 같을 때)
      split_pattern: "{size}_{part}"
      expected_episodes: {train: 2000, test: 100}
      video: {height: 512, width: 512, fps: 16, frames: 65, codec: "H.264"}
      sizes:                       # 001 config 에서 그대로 (면적비는 사용자 README 값)
        - {name: a026, area_ratio: 0.259, w: 0.328, h: 0.314, particles: [54, 51]}
        - {name: a040, area_ratio: 0.399, w: 0.402, h: 0.384, particles: [65, 62]}
        - {name: a060, area_ratio: 0.599, w: 0.486, h: 0.464, particles: [79, 75]}
        - {name: a080, area_ratio: 0.801, w: 0.553, h: 0.528, particles: [89, 86]}
        - {name: ind,  area_ratio: 1.000, w: 0.609, h: 0.582, particles: [98, 94]}
        - {name: a125, area_ratio: 1.249, w: 0.670, h: 0.641, particles: [108, 103]}
        - {name: a160, area_ratio: 1.600, w: 0.746, h: 0.713, particles: [120, 115]}
        - {name: a200, area_ratio: 2.000, w: 0.823, h: 0.786, particles: [133, 127]}
        - {name: a248, area_ratio: 2.479, w: 0.905, h: 0.865, particles: [146, 139]}
      group_order: [a026, a040, a060, a080, ind, a125, a160, a200, a248]
      reference_group: "ind"
      eval_sets: [a026_test, a040_test, a060_test, a080_test, ind_test, a125_test, a160_test, a200_test, a248_test]   # 평가는 *_test 만. 학습은 *_train 만 -> 항상 분리
      train_hydra_env: "acwm_cloth_move"
      total_episodes: 2000         # 모든 학습 분포에서 같다 (데이터량 통제)
      distributions:               # 사용자 확정 2026-11-03 (hypotheses.md 확정 기록 8). 모두 *_train split 에서만, metadata 순서 앞에서부터 take: first
        single_a026:
          - {source: a026_train, group: a026, n: 2000, take: first}
        single_a248:
          - {source: a248_train, group: a248, n: 2000, take: first}
        mix_adjacent:              # a080 + ind + a125, 크기당 667/667/666
          - {source: a080_train, group: a080, n: 667, take: first}
          - {source: ind_train,  group: ind,  n: 667, take: first}
          - {source: a125_train, group: a125, n: 666, take: first}
        mix_wide:                  # a040 + ind + a160, 크기당 667/667/666
          - {source: a040_train, group: a040, n: 667, take: first}
          - {source: ind_train,  group: ind,  n: 667, take: first}
          - {source: a160_train, group: a160, n: 666, take: first}
      download_default_splits: [a026_test, a040_test, a060_test, a080_test, ind_test, a125_test, a160_test, a200_test, a248_test]

mask:                              # 001 과 같은 규칙 (acwm-phys eval_acwm_phys_quant.py 의 HSV 규칙)
  cloth_orange: {hue_lo: 8, hue_hi: 16, sat_min: 120, val_min: 80}
  cloth_pink:   {hue_lo: 158, hue_hi: 170, sat_min: 60, val_min: 80}
  min_px: 6

maskcheck:
  split_part: "test"
  episodes_per_size: 100
  frame_for_area: 3
  resize_to: 224

train:
  seed: 0                          # 단일 모델 기본 시드 (parse_model 기본값)
  seeds: [0, 1, 2]                 # 학습 시드 (사용자 확정)
  distributions: [single_a026, single_a248, mix_adjacent, mix_wide]   # 사용자 승인 2026-11-03 (이름 목록; 정의는 data.datasets.cloth_sim.distributions)
  batch_size: 24                   # 사용자 확정(001 과 동일). 12GB 에 들어가는지 미확인 -> smoke 로 실측
  epochs: 15
  episodes_per_distribution: 2000
  hydra_overrides:                 # 001 config train.hydra_overrides 와 같은 값. batch_size/epochs 는 위 값에서 채운다 (load_config)
    frameskip: 5
    num_hist: 1
    "training.save_every_x_epoch": 1   # 2026-11-05 운영 값 (5 -> 1). 사전 등록 값이 아니다. 재개 시 최대 1 epoch 만 잃게 한다. 학습 step/데이터/시드/결과 계산에 영향 없음. 이미 끝난 mix_wide 3개는 5 로 학습했다(체크포인트 model_5/10/15).
    "training.predictor_lr": 5.0e-5
  run_name_template: "exp003_{dist}_s{seed}"
  approved_distributions: []       # 비어 있음. GPU 학습은 사용자 승인 후 환경변수 EXP003_APPROVED="single_a026 ..." 로만 연다 (run.py train 이 확인)

smoke:                             # 메모리/시간 실측 (12GB 확인용). 이 머신에서는 실행하지 않았다
  distribution: "mix_wide"         # 혼합 분포 하나로 충분한지는 추정: 배치/모델 크기가 분포와 무관해 메모리는 같다고 본다 (미확인)
  seed: 0
  n_episodes: 60                   # env.dataset.n_rollout
  epochs: 1
  poll_interval_s: 2.0             # nvidia-smi 폴링 간격
  extract_episodes_per_size: 5     # 스모크 추출 (9 x 5)

eval:
  n_test_episodes_per_size: 100
  k: 12
  device: "cuda"                   # 브랜치 ViT predictor 의 attention mask 가 .to('cuda') 라 GPU 필수 (001 에서 확인한 사실)
  batch_episodes: 8                # 001 과 같다. 12GB 에서 추론 메모리는 미확인 -> smoke 에서 기록
  save_decoded_frames: 2           # 크기마다 눈으로 볼 에피소드 수

metrics:
  bootstrap_seed: 0
  n_bootstrap: 2000                # 크기별 ratio CI (episode bootstrap, 95%)
  n_bootstrap_slope: 500           # 기울기 CI (크기 안에서 episode 복원추출, 001 과 같은 방식)
  slope_k: 12
  ci: 0.95
  center_interp: "log_log_linear"  # c: 인접 격자 사이 선형 보간. x = log(명목 면적비), y = log(크기별 평균 ratio_ol_over_real). 이 선택은 구현자 결정(사전 등록 문구는 '격자 사이 선형 보간')

criteria:            # hypotheses.md 후보 H, 제안값 채택(근거 수치 아님). 결과를 본 뒤 바꾸지 않는다
  h2_slope_gain_min: 0.2
  seeds_required_same_direction: 3
  bootstrap: {unit: episode, ci: 0.95}
  h1_single_models: {single_a026: a026, single_a248: a248}      # 단일 학습 분포 -> 학습 크기
  h1_opposite_sizes_rule: "all_untrained"   # 구현자 해석(사전 등록 문구 '학습 크기 반대쪽 크기들'): 학습 크기를 뺀 모든 크기의 CI 가 1 을 학습 크기 방향으로 제외해야 한다 (끝 크기라 모두 한쪽에 있다)
  h2_distributions: [mix_adjacent, mix_wide]
  h2_baseline:
    results_json: "../001_size_collapse_diagnosis/results.json"
    runs: [exp001_cs_baseline_single_s0, exp001_cs_baseline_single_s1, exp001_cs_baseline_single_s2]
    slope_path: ["diagnose", "size_curve", "slope_model_vs_real_group_means", "ol@k12", "slope"]
  h2_rule: "all_pairs"   # 구현자 해석: 혼합 3 시드 x baseline 3 시드 = 9쌍 모두 (혼합-baseline) >= 0.2 이면 지지. 9쌍 모두 |차| < 0.2 이면 반증. 그 외 판정 불가. 평균 비교는 하지 않는다

sync:
  drive:
    rclone_remote: "gdrive"        # 001 과 같은 값
    remote_path: "exp003_results"
    local_mount: ""

# 2026-11-05 운영 값 (사전 등록 값 아님; 학습 step/통계/임계값에 영향 없음). 나머지 9개 모델 학습은 Colab 에서 패치된 train.py(colab/train_resume.patch)로 한다.
colab:
  keep_ckpt_epochs: [5, 10, 15]    # DONE 이 된 run 중 train_env.json(save_every=1)이 있는 run 에서만 이 epoch 의 model_<e>.pth 와 model_latest.pth 를 남기고 나머지 삭제(Drive 용량). extract 는 model_latest.pth 를 읽는다. mix_wide 는 train_env.json 이 없어 건드리지 않는다.
  baseline_001_bytes: 12237220     # 001 results.json 의 바이트 수. Drive 에서 이 크기의 파일을 찾아 복사한다 (run.py baseline)
