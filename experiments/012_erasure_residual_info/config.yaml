name: "012_erasure_residual_info"
hypothesis: "notes/hypotheses.md 012 (소거 후 잔여 정보 진단: 009 의 회복 경로). 판정 기준, m_int, attentive 포함은 사용자 확정 2026-11-10. GPU 실행 승인은 별도(미승인)"
seed: 0                          # 전역 시드. 아래 시드도 모두 명시
pilot: true                      # 본 실행 승인 전까지 true (사람이 바꾼다)

base:
  config009: "../009_positive_control_depth/config.yaml"   # 소거 설정을 읽기만 한다 (수정 안 함). 아래 intervention 값과 일치 검사
  config004: "../004_depth_truncation/config.yaml"         # probe 구현, split, 002 경로 (읽기만)
  condition: "multi_60_ind_160"                             # 002 조건 (b), 009 와 같음
  results009: "../009_positive_control_depth/results.json"  # (d) 재현 점검 기준

paths:
  cache_env: "EXP012_CACHE"      # 재계산 hidden 과 방향 캐시. 002 Q1 캐시는 EXP002_CACHE, 체크포인트는 DINO_TRAIN (읽기 전용)

predictor:
  train_seeds: [0, 1, 2]
  feature_part_z: [0, 384]       # z 부분 (소거 대상)
  feature_part_action: [384, 404]  # 행동 10 + proprio 10 (소거하지 않음). (c) 의 입력
  batch_episodes: 8

intervention:                    # 009 와 같아야 한다 (run 시작 시 config009 와 일치 검사)
  m_int: [1, 2, 3, 4, 5, 6]      # 사용자 확정 2026-11-10
  strengths: [0, 1.0]            # 0 = 기준선(같은 측정의 비교값), 1.0 = 소거
  method: "leace_scalar"
  ridge_rel: 0.001
  fit_fraction: 0.5
  fit_seed: 9000                 # 009 와 같은 seed -> 같은 적합 episode, 같은 방향
  apply_to: "z_part_all_tokens"

measure:
  depths: ["m_int", "m_int+1"]   # 사용자 결정 2026-11-10. 판정은 m_int 값으로만, m_int+1 은 보조 관측 (블록 6 은 m_int+1 없음 -> "해당 없음")
  probe_train_rows: "train_episodes_not_used_for_direction_fit"   # 확정 (skeptic I4)
  probe_seeds: [0, 1, 2, 3, 4]
  a_level_classifier:            # (a) 3-클래스(a060, ind, a160) 선형 분류
    model: "logistic_l2"
    c_selection: "GroupKFold within probe-train episodes"   # 004 ridge 의 alpha 선택과 같은 방식
    eval_split_note: "클래스가 학습 레벨 3개뿐이므로 (a) 는 test 의 학습 레벨(train split) episode 에서만 평가한다. interp/extrap 은 해당 없음"
  b_mlp: {input: "pooled_z", hidden: 256, layers: 1, activation: "relu", epochs: 30, lr: 1.0e-3, weight_decay: 1.0e-2, batch_size: 256, val_fraction: 0.1, early_stopping: true, init_seeds: [0, 1, 2, 3, 4]}   # 사용자 결정 2026-11-10 (학습 설정은 002 attentive 와 같음)
  b_attentive: {input: "token_z", source: "002 config probe.attentive (004 와 같은 구현)", d_model: 128, n_heads: 4, mlp_hidden: 256, epochs: 30, lr: 1.0e-3, weight_decay: 1.0e-2, batch_size: 256, val_fraction: 0.1, init_seeds: [0, 1, 2, 3, 4]}   # 사용자 결정 2026-11-10. 002 config 값과 일치 검사
  c_action_only: {model: "ridge_linear_pooled"}   # 004 linear probe 와 같은 ridge, 입력만 행동 좌표
  d_linear_repro: {model: "linear_pooled"}        # 009 깊이 m_int 개입 R² 와 차이 보고

success:                         # 사용자 확정 2026-11-10. 블록별 판정
  strength: 1.0
  min_seeds: 2
  a_accuracy_min: 0.5333333333   # 1/3 + 0.2
  b_r2_min: 0.2                  # MLP 또는 attentive
  c_r2_min: 0.2

run:
  environment: "colab_l4"        # 사용자 결정 2026-11-10. 009 방식 git clone 노트북, 본 실행은 APPROVED_MAIN_012 게이트 (GPU 승인 별도)
  max_attempts: 3
  keep_tmp: false
